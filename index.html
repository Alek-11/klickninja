<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NINJA CATS & DOGS - ULTIMATE EDITION</title>
<style>
    body { margin:0; text-align:center; background:#050505; color:white; font-family:'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { display:block; background:#000; border: 4px solid #444; border-radius: 15px; cursor: crosshair; box-shadow: 0 0 30px rgba(0,255,255,0.3); max-width: 95vw; max-height: 70vh; }
    .stats { font-size: 1.2rem; margin: 10px; font-weight: bold; }
    button { padding:10px 20px; font-size:1rem; cursor:pointer; background: linear-gradient(45deg, #ff00cc, #3333ff); color: white; border: none; border-radius: 25px; margin: 5px; transition: 0.2s; z-index: 10; }
    button:hover { transform: scale(1.1); box-shadow: 0 0 15px #ff00cc; }
    
    #menu-overlay, #game-over-overlay, #world-ranking-overlay, #shop-overlay { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; 
    }
    .menu-box { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; border: 2px solid #00ffff; box-shadow: 0 0 50px #00ffff; min-width: 320px; max-height: 80vh; overflow-y: auto; }
    #cooldown-container { width: 200px; height: 12px; background: #222; border: 2px solid #444; border-radius: 10px; margin: 5px auto; overflow: hidden; }
    #cooldown-fill { width: 100%; height: 100%; background: #00ffff; transition: width 0.1s linear; }
    .world-item { display:flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 5px; font-family: monospace; }
</style>
</head>
<body>

<div id="menu-overlay">
    <div class="menu-box">
        <h1 style="color: #00ffff; text-shadow: 0 0 20px #00ffff;">NINJA CATS & DOGS</h1>
        <input type="text" id="playerName" placeholder="Dein Ninja-Name" style="padding:10px; border-radius:10px; border:none; margin-bottom:10px; width:200px; text-align:center;"><br>
        <p>Schwierigkeit wählen:</p>
        <button onclick="startGame('leicht')" style="background: #28a745;">Leicht</button>
        <button onclick="startGame('mittel')" style="background: #ffc107; color: black;">Mittel</button>
        <button onclick="startGame('schwer')" style="background: #dc3545;">Schwer</button>
    </div>
</div>

<div id="game-over-overlay" style="display:none;">
    <div class="menu-box">
        <h1 style="color: #ff0044;">GAME OVER</h1>
        <div id="ranking-display"></div>
        <button onclick="location.reload()">Hauptmenü</button>
    </div>
</div>

<div id="world-ranking-overlay" style="display:none;">
    <div class="menu-box">
        <h1 style="color: #ffd700;">🌍 TOP 100 WELT</h1>
        <div id="world-list" style="text-align:left;"></div>
        <button onclick="closeWorldRanking()" style="margin-top:20px;">Schließen</button>
    </div>
</div>

<div id="shop-overlay" style="display:none;">
    <div class="menu-box">
        <h1 style="color: #00ffff;">NINJA SHOP</h1>
        <p>Dein Score: <span id="shop-score">0</span></p>
        <button onclick="buyItem('life')">❤️ +1 Leben (50 Pkt)</button><br><br>
        <button onclick="buyItem('combo')">⚡ +1 Combo-Power (100 Pkt)</button><br><br>
        <button onclick="togglePause()" style="background:#444;">Weiter kämpfen</button>
    </div>
</div>

<div class="stats">
    ✨ <span id="score">0</span> | 🏆 Best: <span id="highscore">0</span> | ❤️ <span id="lives">3</span> | 🔥 <span id="combo-display">x1</span>
</div>

<div class="controls">
    <button onclick="togglePause()">Ninja Shop</button>
    <button onclick="location.reload()">Menü</button>
</div>

<div id="cooldown-container"><div id="cooldown-fill"></div></div>
<div style="font-size: 0.8rem; color: #00ffff; margin-bottom: 5px;">[SPACE]: Ninja-Strich | [Strg+A]: Welt-Ranking</div>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let score=0, lives=3, level=1, combo=1, comboBonus=0, lastHitTime=0, highscore=0, currentMode="", ninjaName="Unbekannt";
let animals=[], particles=[], trail=[], paused=true, gameOver=false, spawnRate=1800, gravity=0.15, speedMultiplier=1.0, spawner=null;
let isMouseDown=false;

class Animal {
    constructor() {
        this.x = Math.random() * (canvas.width - 100) + 50;
        this.y = canvas.height;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = -(Math.random() * 7 + 7) * speedMultiplier;
        this.sliced = false;
        let r = Math.random();
        if(r < 0.1) { this.type = "💣"; this.name = "bomb"; this.color = "#ff0000"; }
        else if(r < 0.35) { this.type = "🐯"; this.name = "tiger"; this.color = "#C88141"; }
        else { this.type = "🐱"; this.name = "cat"; this.color = "#ffffff"; }
    }
    update() { this.x += this.vx; this.y += this.vy; this.vy += gravity; }
    draw() { ctx.font = "50px serif"; ctx.fillText(this.type, this.x - 25, this.y); }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.alpha = 1;
    }
    update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.02; }
    draw() {
        ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function startGame(mode) {
    let nameInput = document.getElementById("playerName").value;
    ninjaName = nameInput || "Ninja_" + Math.floor(Math.random()*999);
    currentMode = mode;
    highscore = parseInt(localStorage.getItem("ninjaBest_" + mode)) || 0;
    document.getElementById("menu-overlay").style.display = "none";
    paused = false; score = 0; lives = 3; level = 1; combo = 1; comboBonus = 0; gameOver = false;
    animals = []; particles = []; trail = [];
    if(mode === 'leicht') { spawnRate = 2200; speedMultiplier = 0.8; }
    if(mode === 'mittel') { spawnRate = 1700; speedMultiplier = 1.1; }
    if(mode === 'schwer') { spawnRate = 1200; speedMultiplier = 1.4; }
    restartSpawner(); updateUI(); requestAnimationFrame(gameLoop);
}

function restartSpawner() {
    clearInterval(spawner);
    spawner = setInterval(() => { if(!paused && !gameOver) animals.push(new Animal()); }, spawnRate);
}

function gameLoop() {
    if(paused || gameOver) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if(trail.length > 1) {
        ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        trail.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
    }

    animals.forEach((a, i) => {
        a.update(); a.draw();
        if(a.y > canvas.height + 50) {
            if(!a.sliced && a.name !== "bomb") { lives--; updateUI(); if(lives <= 0) endGame(); }
            animals.splice(i, 1);
        }
    });
    particles.forEach((p, i) => {
        p.update(); p.draw();
        if(p.alpha <= 0) particles.splice(i, 1);
    });
    requestAnimationFrame(gameLoop);
}

function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("shop-score").innerText = score;
    document.getElementById("lives").innerText = Math.max(0, lives);
    document.getElementById("highscore").innerText = highscore;
    document.getElementById("combo-display").innerText = "x" + (combo + comboBonus);
    if(score > highscore) {
        highscore = score;
        localStorage.setItem("ninjaBest_" + currentMode, highscore);
    }
}

function checkHit(mx, my) {
    for (let i = animals.length - 1; i >= 0; i--) {
        let a = animals[i];
        if(!a.sliced && Math.hypot(a.x-mx, a.y-my) < 60) {
            a.sliced = true;
            if(a.name === "bomb") { 
                lives--; if(lives <= 0) endGame(); 
            } else {
                let now = Date.now();
                if(now - lastHitTime < 800) { combo++; } else { combo = 1; }
                lastHitTime = now;
                score += 10 * (combo + comboBonus);
            }
            for(let p=0; p<12; p++) particles.push(new Particle(a.x, a.y, a.color));
            animals.splice(i, 1);
            updateUI();
        }
    }
}

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.getElementById("shop-overlay").style.display = paused ? "flex" : "none";
    if(!paused) requestAnimationFrame(gameLoop);
}

function endGame() {
    gameOver = true; clearInterval(spawner);
    document.getElementById("game-over-overlay").style.display = "flex";
}

// RANG LISTEN LOGIK (Schließen und Öffnen)
function showWorldRanking() {
    const list = document.getElementById("world-list");
    document.getElementById("world-ranking-overlay").style.display = "flex";
    let html = `<div class="world-item" style="color:#00ffff; font-weight:bold;"><span>1. DU (${ninjaName})</span><span>${highscore}</span></div>`;
    for(let i=2; i<=15; i++) {
        html += `<div class="world-item"><span>${i}. Ninja_${Math.floor(Math.random()*999)}</span><span>${Math.max(0, highscore - i*10)}</span></div>`;
    }
    list.innerHTML = html;
}

function closeWorldRanking() {
    document.getElementById("world-ranking-overlay").style.display = "none";
}

// HIER IST DIE REPARIERTE SHOP-LOGIK
function buyItem(itemType) {
    if (itemType === 'life') {
        if (score >= 50) {
            score -= 50;
            lives++;
            updateUI();
        } else {
            alert("Nicht genug Punkte für ein Leben!");
        }
    } else if (itemType === 'combo') {
        if (score >= 100) {
            score -= 100;
            comboBonus++;
            updateUI();
        } else {
            alert("Nicht genug Punkte für Combo-Power!");
        }
    }
}

window.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key === 'a') {
        e.preventDefault();
        showWorldRanking();
    }
});

canvas.addEventListener("mousedown", (e) => {
    isMouseDown = true;
    const rect = canvas.getBoundingClientRect();
    checkHit((e.clientX - rect.left) * (canvas.width / rect.width), (e.clientY - rect.top) * (canvas.height / rect.height));
});
canvas.addEventListener("mouseup", () => { isMouseDown = false; trail = []; });
canvas.addEventListener("mousemove", (e) => {
    if (paused || gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    if (isMouseDown) {
        trail.push({x:mx, y:my});
        if(trail.length > 10) trail.shift(); 
        checkHit(mx, my);
    }
});
</script>
</body>
</html>         
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sternenfall Hintergrund</title>
    <style>
        /* Setzt die Seite auf volle Breite/Höhe und versteckt Scrollbalken */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: sans-serif;
        }

        /* Container für die Sternschnuppen */
        .night {
            position: relative;
            width: 100%;
            height: 100%;
            transform: rotateZ(45deg); /* Dreht die Flugrichtung der Sterne */
        }

        /* Basis-Styling für jede Sternschnuppen-Linie */
        .shooting-star {
            position: absolute;
            left: 50%;
            top: 50%;
            height: 2px;
            background: linear-gradient(-45deg, #5f91ff, rgba(0, 0, 255, 0));
            border-radius: 999px;
            filter: drop-shadow(0 0 6px #699bff);
            animation: tail 3000ms ease-in-out infinite, shooting 3000ms ease-in-out infinite;
        }

        /* Der leuchtende Kopf der Sternschnuppen */
        .shooting-star::before, .shooting-star::after {
            content: '';
            position: absolute;
            top: calc(50% - 1px);
            right: 0;
            height: 2px;
            background: linear-gradient(-45deg, rgba(0, 0, 255, 0), #5f91ff, rgba(0, 0, 255, 0));
            transform: translateX(50%) rotateZ(45deg);
            border-radius: 100%;
            animation: shining 3000ms ease-in-out infinite;
        }

        .shooting-star::after {
            transform: translateX(50%) rotateZ(-45deg);
        }

        /* Individuelle Positionen, Verzögerungen und Längen der Sterne */
        .shooting-star:nth-child(1) { top: 10%; left: 20%; animation-delay: 0ms; animation-duration: 2500ms; }
        .shooting-star:nth-child(2) { top: 30%; left: 40%; animation-delay: 800ms; animation-duration: 3200ms; }
        .shooting-star:nth-child(3) { top: 5%; left: 60%; animation-delay: 1500ms; animation-duration: 2800ms; }
        .shooting-star:nth-child(4) { top: 50%; left: 10%; animation-delay: 2200ms; animation-duration: 3500ms; }
        .shooting-star:nth-child(5) { top: 25%; left: 80%; animation-delay: 500ms; animation-duration: 3000ms; }
        .shooting-star:nth-child(6) { top: 70%; left: 30%; animation-delay: 1800ms; animation-duration: 2700ms; }
        .shooting-star:nth-child(7) { top: 40%; left: 70%; animation-delay: 1100ms; animation-duration: 3300ms; }

        /* Animation für das Ausfahren des Schweifs */
        @keyframes tail {
            0% { width: 0; }
            30% { width: 100px; }
            100% { width: 0; }
        }

        /* Animation für das Leuchten */
        @keyframes shining {
            0% { width: 0; }
            50% { width: 30px; }
            100% { width: 0; }
        }

        /* Animation für die Bewegung über den Bildschirm */
        @keyframes shooting {
            0% { transform: translateX(0); }
            100% { transform: translateX(300px); }
        }

        /* Overlay-Text (kann gelöscht werden) */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Sternenfall</h1>
        <p>Ein reiner CSS-Hintergrund.</p>
    </div>

    <!-- Die CSS-Sterne -->
    <div class="night">
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

</body>
</html>
