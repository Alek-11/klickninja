<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NINJA CATS & DOGS - PERFECT HITBOX</title>
<style>
    body { margin:0; text-align:center; background:#050505; color:white; font-family:'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { display:block; background:#000; border: 4px solid #444; border-radius: 15px; cursor: crosshair; box-shadow: 0 0 30px rgba(0,255,255,0.3); max-width: 95vw; max-height: 70vh; }
    .stats { font-size: 1.2rem; margin: 10px; font-weight: bold; }
    button { padding:10px 20px; font-size:1rem; cursor:pointer; background: linear-gradient(45deg, #ff00cc, #3333ff); color: white; border: none; border-radius: 25px; margin: 5px; transition: 0.2s; }
    button:hover { transform: scale(1.1); box-shadow: 0 0 15px #ff00cc; }
    #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .menu-box { background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; border: 2px solid #00ffff; box-shadow: 0 0 50px #00ffff; }
    .difficulty-btn { width: 200px; margin: 10px; font-weight: bold; text-transform: uppercase; }
    #shop-overlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.95); padding: 20px; border: 2px solid #00ffff; border-radius: 20px; z-index: 10; width: 280px; }
</style>
</head>
<body>

<div id="menu-overlay">
    <div class="menu-box">
        <h1 style="color: #00ffff; text-shadow: 0 0 20px #00ffff;">NINJA CATS & DOGS</h1>
        <p>Wähle deine Schwierigkeit:</p>
        <button class="difficulty-btn" style="background: #28a745;" onclick="startGame('leicht')">Leicht</button><br>
        <button class="difficulty-btn" style="background: #ffc107; color: black;" onclick="startGame('mittel')">Mittel</button><br>
        <button class="difficulty-btn" style="background: #dc3545;" onclick="startGame('schwer')">Schwer</button>
    </div>
</div>

<div class="stats">✨ <span id="score">0</span> | 🏆 <span id="mode-label">Best</span>: <span id="highscore">0</span> | ❤️ <span id="lives">3</span> | Lvl <span id="level">1</span> | 🔥 <span id="combo">x1</span></div>
<div class="controls"><button onclick="togglePause()">Ninja Shop</button><button onclick="location.reload()">Hauptmenü</button></div>

<div id="shop-overlay">
    <h2 style="color: #00ffff; margin-top:0;">NINJA SHOP</h2>
    <button onclick="buyItem('life')">❤️ +1 Leben (50)</button><br><br>
    <button onclick="buyItem('combo')">⚡ Combo (100)</button><br><br>
    <button onclick="togglePause()" style="background:#444;">Schließen</button>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let score=0, lives=3, level=1, combo=1, comboBonus=0, lastHitTime=0, highscore=0, currentMode="";
let animals=[], particles=[], trail=[], paused=true, gameOver=false, spawnRate=1800, gravity=0.15, speedMultiplier=1.0, spawner=null;
let bossActive=false, bossClicks=0, bossRequired=20, bossTime=10, bossTimer=null, prices={life:50, combo:100}, isMouseDown=false;

function startGame(mode) {
    currentMode = mode;
    document.getElementById("menu-overlay").style.display = "none";
    document.getElementById("mode-label").innerText = "Best (" + mode.toUpperCase() + ")";
    highscore = parseInt(localStorage.getItem("ninjaBest_" + currentMode)) || 0;
    document.getElementById("highscore").innerText = highscore;
    paused = false; score = 0; lives = 3; level = 1;
    if(mode === 'leicht') { spawnRate = 2200; speedMultiplier = 0.8; }
    if(mode === 'mittel') { spawnRate = 1700; speedMultiplier = 1.1; }
    if(mode === 'schwer') { spawnRate = 1200; speedMultiplier = 1.5; }
    restartSpawner(); updateUI();
}

function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("lives").innerText = Math.max(0, lives);
    document.getElementById("level").innerText = level;
    document.getElementById("combo").innerText = "x" + (combo + comboBonus);
    if(score > highscore) { highscore = score; document.getElementById("highscore").innerText = highscore; localStorage.setItem("ninjaBest_" + currentMode, highscore); }
}

canvas.addEventListener("mousedown", () => { isMouseDown = true; });
canvas.addEventListener("mouseup", () => { isMouseDown = false; trail = []; });
canvas.addEventListener("mousemove", (e) => {
    if (paused || gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    
    if (isMouseDown) {
        trail.push({x:mx, y:my});
        if(trail.length > 20) trail.shift(); 

        if(bossActive && Math.hypot(mx-400, my-300) < 100) {
            bossClicks++;
            if(bossClicks >= bossRequired) { bossActive=false; clearInterval(bossTimer); score+=200; updateUI(); }
        }

        for (let i = animals.length - 1; i >= 0; i--) {
            let a = animals[i];
            // HITBOX VERGRÖSSERT AUF 60
            if(!a.sliced && Math.hypot(a.x-mx, a.y-my) < 60) {
                a.sliced = true;
                if(a.name === "bomb" || a.name === "devil") { lives--; combo=1; if(lives <= 0) gameOver=true; }
                else if(a.name === "angel") { lives++; }
                else {
                    combo = (Date.now() - lastHitTime < 700) ? combo + 1 : 1;
                    lastHitTime = Date.now();
                    score += (a.name === "gold" ? 50 : 10) * (combo + comboBonus);
                }
                for(let p=0; p<15; p++) particles.push(new Particle(a.x, a.y, a.color));
                updateUI(); animals.splice(i, 1);
                if(score >= level * 100) { level++; speedMultiplier += 0.1; spawnRate *= 0.9; restartSpawner(); if(level%3===0) startBoss(); }
            }
        }
    }
});

class Particle {
    constructor(x, y, color) { this.x=x; this.y=y; this.vx=(Math.random()-0.5)*10; this.vy=(Math.random()-0.5)*10; this.life=1.0; this.color=color; }
    update() { this.x += this.vx; this.y += this.vy; this.life -= 0.04; }
    draw() { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; }
}

class Animal {
    constructor() {
        this.x = Math.random()*(canvas.width-100)+50; this.y = canvas.height+30; this.vx = (Math.random()-0.5)*6; this.vy = -(Math.random()*4+9)*speedMultiplier; this.sliced = false;
        let r = Math.random();
        if(r<0.01){this.type="🐹";this.name="gold";this.color="#ffd700";this.vx*=2;}
        else if(r<0.06){this.type="😇";this.name="angel";this.color="#fff";}
        else if(r<0.13){this.type="😈";this.name="devil";this.color="#f06";}
        else if(r<0.20){this.type="💣";this.name="bomb";this.color="#f00";}
        else if(r<0.35){this.type="🐰";this.name="bunny";this.color="#fff";}
        else if(r<0.65){this.type="🐱";this.name="cat";this.color="#f6c";}
        else{this.type="🐶";this.name="dog";this.color="#6cf";}
    }
    update() { if(this.name==="bunny")this.vx+=Math.sin(Date.now()/100)*0.5; this.x+=this.vx; this.y+=this.vy; this.vy+=gravity; if(this.y>canvas.height+50&&!this.sliced){if(!["bomb","angel","devil"].includes(this.name)){lives--;updateUI();} this.sliced=true; if(lives<=0)gameOver=true;} }
    draw() { ctx.font=(this.name === "gold" ? "50px" : "40px") + " Arial"; ctx.shadowBlur=12; ctx.shadowColor=this.color; ctx.fillText(this.type, this.x-20, this.y); ctx.shadowBlur=0; }
}

function startBoss() {
    if (bossActive) return;
    bossActive = true; bossClicks = 0; bossTime = 10; bossRequired = 20 + (level * 3);
    if (bossTimer) clearInterval(bossTimer);
    bossTimer = setInterval(() => { if (!paused) { bossTime--; if (bossTime <= 0) { bossActive = false; clearInterval(bossTimer); lives--; updateUI(); if (lives <= 0) gameOver = true; } } }, 1000);
}

function restartSpawner() { clearInterval(spawner); spawner=setInterval(()=>{if(!paused&&!gameOver&&!bossActive)animals.push(new Animal());},spawnRate); }
function togglePause() { paused=!paused; document.getElementById("shop-overlay").style.display=paused?"block":"none"; }
function buyItem(t) { if(score>=prices[t]){score-=prices[t];if(t==='life')lives++;else comboBonus++;prices[t]=Math.ceil(prices[t]*1.5);updateUI();} }

function gameLoop() {
    let g=ctx.createLinearGradient(0,0,0,500); g.addColorStop(0,"#000428"); g.addColorStop(1,"#004e92"); ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
    if(gameOver){ctx.fillStyle="#fff";ctx.font="60px Arial";ctx.textAlign="center";ctx.fillText("GAME OVER",400,250);}
    else if(!paused) {
        if(!bossActive) for(let i=animals.length-1; i>=0; i--){ animals[i].update(); animals[i].draw(); if(animals[i].y > 600) animals.splice(i,1); }
        particles.forEach((p,i)=>{p.update();p.draw();if(p.life<=0)particles.splice(i,1);});
        if(bossActive){
            ctx.save(); let shake = Math.sin(Date.now() * 0.1) * 5; ctx.textAlign = "center"; ctx.font = "120px Arial"; ctx.fillText("👹", 400 + shake, 300); 
            ctx.fillStyle = "red"; ctx.fillRect(300, 180, 200, 10); ctx.fillStyle = "lime"; ctx.fillRect(300, 180, (bossClicks/bossRequired)*200, 10);
            ctx.font = "25px Arial"; ctx.fillStyle = "yellow"; ctx.fillText(`BOSS! ${bossTime}s`, 400, 150); ctx.restore();
        }
        if(isMouseDown && trail.length > 1){
            ctx.save(); ctx.shadowBlur=25; ctx.shadowColor="#00ffff"; ctx.strokeStyle="#fff"; ctx.lineWidth=8; ctx.lineCap="round"; ctx.lineJoin="round";
            ctx.beginPath(); ctx.moveTo(trail.x, trail.y); for(let i=1; i<trail.length; i++) { ctx.lineTo(trail[i].x, trail[i].y); } ctx.stroke(); ctx.restore();
        }
    }
    requestAnimationFrame(gameLoop);
}
gameLoop(); setInterval(()=> { if(!isMouseDown && trail.length > 0) trail.shift(); }, 30);
</script>
</body>
</html>
